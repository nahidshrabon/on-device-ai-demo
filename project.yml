name: AILab
options:
  bundleIdPrefix: dev.ailab
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AILab:
    type: application
    platform: iOS
    sources: [AILab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ailab.AILab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to scan text and codes."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used for on-device transcription and sound analysis."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used for on-device transcription."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to pick images to analyze on device."
  AILabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AILabTests]
    dependencies:
      - target: AILab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ailab.AILabTests
schemes:
  AILab:
    build:
      targets:
        AILab: all
        AILabTests: [test]
    test:
      targets: [AILabTests]
